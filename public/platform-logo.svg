<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Inner Subtle Grid Glow -->
  <circle cx="60" cy="60" r="38" fill="#10b981" fill-opacity="0.06" />

  <!-- Isometric Hex Cube / Monogram Emblem -->
  <!-- Top Face -->
  <polygon points="60,26 86,41 60,56 34,41" fill="url(#primaryGrad)" />
  
  <!-- Left Face -->
  <polygon points="34,43 59,57 59,88 34,74" fill="url(#facetGrad)" fill-opacity="0.88" />
  
  <!-- Right Face -->
  <polygon points="61,57 86,43 86,74 61,88" fill="url(#accentGrad)" fill-opacity="0.95" />

  <!-- Core Modern Node -->
  <circle cx="60" cy="57" r="5" fill="#ffffff" filter="url(#glow)" />
</svg>
