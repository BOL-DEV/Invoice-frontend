<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 68" width="64" height="68" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Hex Cube (Standalone - No Box / No Container) -->
  <!-- Top Face -->
  <polygon points="32,2 62,19.3 32,36.6 2,19.3" fill="url(#primaryGrad)" />
  
  <!-- Left Face -->
  <polygon points="2,21.5 31,37.8 31,66 2,49.7" fill="url(#facetGrad)" fill-opacity="0.9" />
  
  <!-- Right Face -->
  <polygon points="33,37.8 62,21.5 62,49.7 33,66" fill="url(#accentGrad)" fill-opacity="0.95" />

  <!-- Core Modern Node -->
  <circle cx="32" cy="37.8" r="4.5" fill="#ffffff" filter="url(#glow)" />
</svg>
